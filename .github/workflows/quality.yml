name: Code quality

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
      - name: Lint, test and compile
        run: gradle lint :core:test :data:test :app:compileKotlin --continue --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            build/reports/
            app/build/reports/
            core/build/reports/
            data/build/reports/
          if-no-files-found: ignore
